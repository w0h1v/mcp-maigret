name: Feature request
description: Suggest a capability or improvement
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        mcp-maigret wraps the maigret command line. Features that need new maigret abilities belong in the [maigret project](https://github.com/soxoj/maigret/issues) first.
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The task, not the solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: Tool names, parameters, or behaviour you would like.
  - type: textarea
    id: maigret
    attributes:
      label: Does maigret support it?
      description: Link the maigret option or documentation, or write "not sure".
